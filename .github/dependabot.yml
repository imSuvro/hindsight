version: 2

# Better Auth patches security issues quickly and often, so staying current is
# the control rather than an optional chore. See ADR-0006.
updates:
  - package-ecosystem: npm
    directory: "/"
    # Dependency updates are changes like any other and land on the integration
    # branch, not straight onto the released one.
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    ignore:
      # Major bumps of the toolchain are deliberate migrations with their own
      # branch and their own reasoning, not something to review at 5 a.m. as a
      # one-line diff. Minor and patch updates still arrive.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    groups:
      # One pull request for the routine noise; anything with a security
      # advisory still arrives on its own.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
