name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A superseded run tells you nothing useful, so cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Pinned so Windows developers and CI exercise the same server.
  MONGOMS_VERSION: "8.0.15"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate route types
        run: pnpm exec next typegen
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint --max-warnings=0
      - name: Check formatting
        run: pnpm format:check
      - name: Refuse committed environment files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "Environment files must never be committed:"
            echo "$tracked"
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Downloading mongod on every run is the main source of flake here.
      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          # The build only needs these to satisfy boot-time validation; nothing
          # here reaches a real service.
          MONGODB_URI: mongodb://127.0.0.1:27017/hindsight-build
          BETTER_AUTH_SECRET: build-time-placeholder-secret-not-used-at-runtime
          BETTER_AUTH_URL: http://localhost:3000
          CRON_SECRET: build-time-placeholder-cron-secret
          EMAIL_MODE: log
